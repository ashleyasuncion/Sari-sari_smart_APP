[versions]
agp = "8.7.3"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
activity-compose = "1.9.3"
compose-bom = "2025.01.01"
navigation-compose = "2.8.5"
lifecycle = "2.8.7"
core-ktx = "1.15.0"
room = "2.6.1"
ksp = "2.0.21-1.0.28"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
